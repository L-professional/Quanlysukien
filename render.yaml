services:
  # Backend FastAPI Service
  - type: web
    name: eventhub-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventhub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://quanlysukien.vercel.app,http://localhost:5173,http://localhost:3000,http://localhost:3001"
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  # PostgreSQL Database (Render Database)
  - name: eventhub-db
    databaseName: eventhub
    user: eventhub_user
    plan: free
